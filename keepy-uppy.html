<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Keepy Uppy</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #4ab0e8; overflow: hidden; user-select: none; touch-action: none; }
    canvas { display: block; }
    #back {
      position: absolute;
      top: 14px; left: 14px;
      background: rgba(255,255,255,0.85);
      border: none; border-radius: 20px;
      padding: 7px 16px;
      font-family: 'Comic Neue', 'Comic Sans MS', cursive;
      font-size: 17px; cursor: pointer;
      color: #cc44aa; font-weight: bold;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 10;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<a id="back" href="index.html">← Back</a>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  // ---- Images ----
  const blueyImg = new Image(); blueyImg.src = 'bluey.png';
  const bingoImg = new Image(); bingoImg.src = 'bingo.png';

  // ---- Audio ----
  let audioCtx = null;
  const gameOverAudio = new Audio('keepy uppy.m4a');

  function playBoing() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const f = 1174; // D6 — bright, clear pitch

      // Fundamental tone: pure sine, long ring-out
      const osc1  = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.value = f;
      gain1.gain.setValueAtTime(0.55, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
      osc1.connect(gain1); gain1.connect(audioCtx.destination);
      osc1.start(now); osc1.stop(now + 1.5);

      // Inharmonic overtone (~2.76× fundamental) — gives bells their "ting" shimmer
      const osc2  = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.value = f * 2.756;
      gain2.gain.setValueAtTime(0.22, now);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc2.connect(gain2); gain2.connect(audioCtx.destination);
      osc2.start(now); osc2.stop(now + 0.55);
    } catch (e) {}
  }

  // ---- Layout helpers ----
  function GY()        { return canvas.height * 0.82; }
  function BLUEY_X()   { return canvas.width  * 0.18; }
  function BINGO_X()   { return canvas.width  * 0.82; }
  function DOG_H()     { return canvas.height * 0.22; }            // character image height
  function HIT_Y()     { return GY() - DOG_H() * 0.55; }          // balloon handoff height
  function PEAK_Y()    { return canvas.height * 0.17; }            // top of fixed arc
  function FLY_FRAMES(){ return 105; }                             // frames per arc (slower)
  function FALL_G()    { return Math.min(0.36, 0.09 + score * 0.004); } // gravity while waiting

  // ---- State ----
  let gameState = 'start';
  let ballPhase = 'wait';
  let activeDog = 'bluey';
  let score = 0, highScore = 0;

  let bx = 0, by = 0;
  let flyT = 0;
  let arcP0 = { x: 0, y: 0 };
  let arcP2 = { x: 0, y: 0 };
  let waitVy = 0;

  let blueyTimer = 0, bingoTimer = 0;
  let particles = [];
  let idlePhase = 0;

  // ---- Bezier arc ----
  function arcPos(t) {
    const p1x = (arcP0.x + arcP2.x) / 2;
    const p1y = PEAK_Y();
    const mt = 1 - t;
    return {
      x: mt * mt * arcP0.x + 2 * mt * t * p1x + t * t * arcP2.x,
      y: mt * mt * arcP0.y + 2 * mt * t * p1y + t * t * arcP2.y
    };
  }

  // ---- Game logic ----
  function initGame() {
    score = 0;
    activeDog = 'bluey';
    bx = BLUEY_X();
    by = HIT_Y();
    ballPhase = 'wait';
    waitVy = 0;
    blueyTimer = 0; bingoTimer = 0;
    particles = [];
  }

  function onTap() {
    if (gameState === 'start' || gameState === 'gameover') {
      gameState = 'playing';
      initGame();
      return;
    }
    if (gameState !== 'playing') return;

    playBoing();

    const isBluey = activeDog === 'bluey';
    if (isBluey) blueyTimer = 20; else bingoTimer = 20;

    arcP0 = { x: bx, y: by };  // start arc from wherever balloon currently is
    arcP2 = { x: isBluey ? BINGO_X() : BLUEY_X(), y: HIT_Y() };
    flyT = 0;
    ballPhase = 'fly';

    activeDog = isBluey ? 'bingo' : 'bluey';
    score++;

    for (let i = 0; i < 10; i++) {
      const angle = (Math.PI * 2 / 10) * i;
      particles.push({
        x: bx, y: by,
        vx: Math.cos(angle) * (2 + Math.random() * 2),
        vy: Math.sin(angle) * (2 + Math.random() * 2) - 2,
        life: 35, maxLife: 35,
        color: ['#ffdd00','#ff6b6b','#66ccff','#ff99cc','#88ff44'][i % 5]
      });
    }
  }

  canvas.addEventListener('click', onTap);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); onTap(); }, { passive: false });

  // ---- Update ----
  function update() {
    if (gameState !== 'playing') return;

    if (ballPhase === 'fly') {
      flyT += 1 / FLY_FRAMES();
      if (flyT >= 1) {
        flyT = 1;
        ballPhase = 'wait';
        waitVy = 0;
        if (activeDog === 'bluey') blueyTimer = Math.max(blueyTimer, 6);
        else                       bingoTimer = Math.max(bingoTimer, 6);
      }
      const pos = arcPos(flyT);
      bx = pos.x; by = pos.y;
    } else {
      waitVy += FALL_G();
      by += waitVy;
      if (by > GY() - 10) {
        gameState = 'gameover';
        if (score > highScore) highScore = score;
        gameOverAudio.currentTime = 0;
        gameOverAudio.play().catch(() => {});
      }
    }

    if (blueyTimer > 0) blueyTimer--;
    if (bingoTimer > 0) bingoTimer--;

    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.16; p.life--; }
    particles = particles.filter(p => p.life > 0);
  }

  // ---- Drawing ----

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.62);
    sky.addColorStop(0, '#3da8e8');
    sky.addColorStop(1, '#90d8f5');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height * 0.62);

    drawSun(canvas.width * 0.87, canvas.height * 0.10);
    drawCloud(canvas.width * 0.14, canvas.height * 0.09, 56);
    drawCloud(canvas.width * 0.52, canvas.height * 0.06, 70);
    drawCloud(canvas.width * 0.82, canvas.height * 0.14, 44);
    drawSeagulls();

    const waterTop = canvas.height * 0.58;
    const ocean = ctx.createLinearGradient(0, waterTop, 0, GY());
    ocean.addColorStop(0, '#1a8fbf');
    ocean.addColorStop(1, '#0db5b0');
    ctx.fillStyle = ocean;
    ctx.fillRect(0, waterTop, canvas.width, GY() - waterTop);

    const t = Date.now() / 1000;
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2;
    [waterTop + 14, waterTop + 32, waterTop + 50].forEach((wy, row) => {
      ctx.beginPath();
      for (let wx = 0; wx <= canvas.width; wx += 4) {
        const y = wy + Math.sin(wx * 0.022 + t * 1.6 + row * 1.1) * 4;
        wx === 0 ? ctx.moveTo(wx, y) : ctx.lineTo(wx, y);
      }
      ctx.stroke();
    });

    const sand = ctx.createLinearGradient(0, GY(), 0, canvas.height);
    sand.addColorStop(0, '#f5d898'); sand.addColorStop(1, '#e8c97a');
    ctx.fillStyle = sand;
    ctx.fillRect(0, GY(), canvas.width, canvas.height - GY());
    ctx.fillStyle = 'rgba(0,110,150,0.18)';
    ctx.fillRect(0, GY(), canvas.width, 10);

    drawShell(canvas.width * 0.32, GY() + 16);
    drawShell(canvas.width * 0.55, GY() + 22);
    drawShell(canvas.width * 0.72, GY() + 12);
  }

  function drawSun(sx, sy) {
    const r = Math.min(canvas.width, canvas.height) * 0.052;
    const glow = ctx.createRadialGradient(sx, sy, r * 0.4, sx, sy, r * 2.6);
    glow.addColorStop(0, 'rgba(255,235,80,0.55)');
    glow.addColorStop(1, 'rgba(255,200,50,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(sx, sy, r * 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 2.5;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(sx + Math.cos(a) * r * 1.35, sy + Math.sin(a) * r * 1.35);
      ctx.lineTo(sx + Math.cos(a) * r * 1.95, sy + Math.sin(a) * r * 1.95);
      ctx.stroke();
    }
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,0.90)';
    ctx.beginPath();
    ctx.arc(x,            y,            s * 0.50, 0, Math.PI * 2);
    ctx.arc(x + s * 0.44, y - s * 0.10, s * 0.38, 0, Math.PI * 2);
    ctx.arc(x + s * 0.86, y + s * 0.04, s * 0.42, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSeagulls() {
    ctx.strokeStyle = 'rgba(20,30,60,0.40)'; ctx.lineWidth = 1.5;
    [[0.26, 0.47], [0.42, 0.43], [0.63, 0.46], [0.70, 0.41]].forEach(([rx, ry]) => {
      const sx = canvas.width * rx, sy = canvas.height * ry, w = 10;
      ctx.beginPath();
      ctx.moveTo(sx - w, sy);
      ctx.quadraticCurveTo(sx - w * 0.5, sy - 5, sx, sy);
      ctx.quadraticCurveTo(sx + w * 0.5, sy - 5, sx + w, sy);
      ctx.stroke();
    });
  }

  function drawShell(x, y) {
    ctx.save();
    ctx.fillStyle = 'rgba(240,200,150,0.8)';
    ctx.strokeStyle = 'rgba(180,130,80,0.6)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(x, y, 7, 4, 0.3, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawBalloon(ballX, ballY) {
    const r = Math.min(canvas.width, canvas.height) * 0.046;

    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.ellipse(ballX, GY() + 5, 22, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    const grad = ctx.createRadialGradient(ballX - r * 0.32, ballY - r * 0.42, r * 0.08, ballX, ballY, r * 1.15);
    grad.addColorStop(0, '#ffaaaa'); grad.addColorStop(0.4, '#ff2222'); grad.addColorStop(1, '#990000');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.ellipse(ballX, ballY, r, r * 1.26, 0, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.globalAlpha = 0.42; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(ballX - r * 0.28, ballY - r * 0.38, r * 0.22, r * 0.13, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#bb0000';
    ctx.beginPath(); ctx.arc(ballX, ballY + r * 1.3, r * 0.15, 0, Math.PI * 2); ctx.fill();

    const wave = Math.sin(Date.now() / 600) * 6;
    ctx.strokeStyle = 'rgba(60,60,60,0.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(ballX, ballY + r * 1.45);
    ctx.bezierCurveTo(ballX + wave, ballY + r * 1.8, ballX - wave, ballY + r * 2.2, ballX, ballY + r * 2.55);
    ctx.stroke();
  }

  function drawDog(x, pixelBounce, img, label, nameColor, showTap) {
    const gy = GY();
    const h  = DOG_H();
    // Preserve natural aspect ratio; fall back to square if not loaded yet
    const w  = img.naturalWidth && img.naturalHeight
               ? h * (img.naturalWidth / img.naturalHeight)
               : h;
    const dogBottom = gy - pixelBounce;   // feet level
    const imgTop    = dogBottom - h;

    // Pulsing glow underfoot when it's this dog's turn
    if (showTap) {
      const pulse = 0.6 + Math.sin(Date.now() / 230) * 0.4;
      ctx.save();
      ctx.globalAlpha = pulse * 0.40;
      ctx.fillStyle = nameColor;
      ctx.beginPath(); ctx.ellipse(x, gy - 4, w * 0.52, w * 0.14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Character image
    if (img.complete && img.naturalWidth) {
      ctx.drawImage(img, x - w / 2, imgTop, w, h);
    } else {
      // Fallback emoji while image loads
      ctx.font = `${h}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('🐶', x, dogBottom);
    }

    // Name label
    const ls = Math.round(h * 0.20);
    ctx.font = `bold ${ls}px "Comic Neue", cursive`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.lineWidth = 4; ctx.strokeStyle = 'white';
    ctx.strokeText(label, x, gy + 6);
    ctx.fillStyle = nameColor;
    ctx.fillText(label, x, gy + 6);

    // TAP! indicator (only during wait phase)
    if (showTap) {
      const bob  = Math.abs(Math.sin(Date.now() / 320)) * 10;
      const tapY = imgTop - 12 - bob;
      const ts   = Math.round(h * 0.20);
      ctx.font = `bold ${ts}px "Comic Neue", cursive`;
      ctx.textBaseline = 'bottom';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.strokeText('👆 TAP!', x, tapY);
      ctx.fillStyle = '#fff';
      ctx.fillText('👆 TAP!', x, tapY);
    }
  }

  function drawScore() {
    const fs = Math.round(Math.min(canvas.width, canvas.height) * 0.075);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.font = `bold ${fs}px "Comic Neue", cursive`;
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.28)';
    ctx.strokeText(`${score}`, canvas.width / 2, 14);
    ctx.fillStyle = 'white';
    ctx.fillText(`${score}`, canvas.width / 2, 14);
    if (highScore > 0) {
      const fs2 = Math.round(fs * 0.48);
      ctx.font = `${fs2}px "Comic Neue", cursive`;
      ctx.strokeText(`Best: ${highScore}`, canvas.width / 2, 14 + fs + 6);
      ctx.fillText(`Best: ${highScore}`, canvas.width / 2, 14 + fs + 6);
    }
  }

  function drawOverlay(title, titleColor, lines, tapMsg) {
    ctx.fillStyle = 'rgba(0,0,20,0.50)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2, cy = canvas.height / 2;
    const fs = Math.round(Math.min(canvas.width, canvas.height) * 0.09);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold ${fs}px "Comic Neue", cursive`;
    ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.strokeText(title, cx, cy - fs * 1.5);
    ctx.fillStyle = titleColor; ctx.fillText(title, cx, cy - fs * 1.5);
    const lfs = Math.round(fs * 0.48);
    ctx.font = `${lfs}px "Comic Neue", cursive`; ctx.lineWidth = 3;
    lines.forEach((line, i) => {
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.strokeText(line, cx, cy - fs * 0.1 + i * lfs * 1.5);
      ctx.fillStyle = 'white'; ctx.fillText(line, cx, cy - fs * 0.1 + i * lfs * 1.5);
    });
    const alpha = 0.65 + Math.sin(Date.now() / 380) * 0.35;
    ctx.globalAlpha = alpha;
    ctx.font = `bold ${Math.round(fs * 0.55)}px "Comic Neue", cursive`;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.strokeText(tapMsg, cx, cy + fs * 1.4);
    ctx.fillStyle = '#ffd700'; ctx.fillText(tapMsg, cx, cy + fs * 1.4);
    ctx.globalAlpha = 1;
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.save(); ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  // ---- Game loop ----
  function loop() {
    requestAnimationFrame(loop);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();

    if (gameState === 'start') {
      idlePhase += 0.022;
      const ibx = canvas.width  / 2 + Math.sin(idlePhase)        * 48;
      const iby = canvas.height * 0.34 + Math.sin(idlePhase * 1.3) * 14;
      drawDog(BLUEY_X(), 0, blueyImg, 'Bluey', '#3399ff', false);
      drawDog(BINGO_X(), 0, bingoImg, 'Bingo', '#ff8800', false);
      drawBalloon(ibx, iby);
      drawOverlay('Keepy Uppy! 🎈', '#ffee44',
        ["Keep the balloon in the air!", "Tap when it's your dog's turn!"],
        '🎈 Tap to Start! 🎈');
      return;
    }

    update();

    drawParticles();
    drawBalloon(bx, by);

    const blueyBounce = blueyTimer > 0 ? Math.sin((20 - blueyTimer) / 20 * Math.PI) * 28 : 0;
    const bingoBounce = bingoTimer > 0 ? Math.sin((20 - bingoTimer) / 20 * Math.PI) * 28 : 0;

    const showBlueyTap = gameState === 'playing' && activeDog === 'bluey';
    const showBingoTap = gameState === 'playing' && activeDog === 'bingo';

    drawDog(BLUEY_X(), blueyBounce, blueyImg, 'Bluey', '#3399ff', showBlueyTap);
    drawDog(BINGO_X(), bingoBounce, bingoImg, 'Bingo', '#ff8800', showBingoTap);

    if (gameState === 'playing') drawScore();

    if (gameState === 'gameover') {
      const newHS = score > 0 && score >= highScore;
      drawOverlay('Oh no! 😢', '#ff5555',
        [`The balloon fell down!`,
         `You kept it up ${score} time${score !== 1 ? 's' : ''}!`,
         newHS ? '🌟 New High Score! 🌟' : `Best: ${highScore}`],
        '🎈 Tap to Play Again! 🎈');
    }
  }

  bx = canvas.width / 2;
  by = canvas.height * 0.34;
  requestAnimationFrame(loop);
</script>
</body>
</html>
