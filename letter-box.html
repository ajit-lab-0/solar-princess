<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Letter Box</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: 'Comic Sans MS', cursive;
      background: linear-gradient(180deg, #87CEEB 0%, #b8f5c8 50%, #ffb6e6 100%);
      user-select: none;
    }

    #game {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 6px 8px;
    }

    #header {
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      padding: 4px 0 2px;
      flex-shrink: 0;
    }

    #progress {
      text-align: center;
      font-size: 0.85em;
      color: rgba(255,255,255,0.95);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
      padding: 2px 0 4px;
      flex-shrink: 0;
    }

    #objects-area {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: flex-start;
      gap: 8px;
      padding: 6px 4px;
      overflow-y: auto;
    }

    .object-card {
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 88px;
      height: 98px;
      cursor: grab;
      padding: 6px 4px;
      flex-shrink: 0;
    }

    .object-card.dragging-source { opacity: 0.3; }

    .obj-emoji { font-size: 2.6em; line-height: 1; }

    .obj-name {
      font-size: 0.65em;
      color: #555;
      text-align: center;
      margin-top: 4px;
      line-height: 1.1;
    }

    #boxes-area {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 6px 4px 8px;
    }

    .letter-box {
      flex: 1;
      max-width: 140px;
      min-height: 160px;
      border-radius: 22px;
      border: 3px dashed rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 4px 8px;
      transition: border-color 0.15s, background 0.15s, transform 0.15s;
    }

    .letter-box:nth-child(1) { background: rgba(255, 210, 210, 0.85); }
    .letter-box:nth-child(2) { background: rgba(210, 235, 255, 0.85); }
    .letter-box:nth-child(3) { background: rgba(210, 255, 220, 0.85); }

    .letter-box.highlight {
      border-color: #4CAF50;
      border-style: solid;
      transform: scale(1.06);
    }

    .letter-box.wrong-flash {
      border-color: #e53935;
      border-style: solid;
      background: rgba(229, 57, 53, 0.15) !important;
    }

    .box-letter {
      font-size: 3.2em;
      font-weight: bold;
      color: #333;
      line-height: 1;
    }

    .box-items {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2px;
      margin-top: 5px;
    }

    .box-mini-item {
      font-size: 1.6em;
      animation: pop-in 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes pop-in {
      0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
      70%  { transform: scale(1.3) rotate(5deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes shake {
      0%,100% { transform: translateX(0) rotate(0deg); }
      20%     { transform: translateX(-10px) rotate(-3deg); }
      40%     { transform: translateX(10px) rotate(3deg); }
      60%     { transform: translateX(-8px) rotate(-2deg); }
      80%     { transform: translateX(8px) rotate(2deg); }
    }

    .shake { animation: shake 0.45s ease; }

    .drag-clone {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      transform: scale(1.12) rotate(4deg);
      box-shadow: 0 10px 24px rgba(0,0,0,0.28);
      border-radius: 16px;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 4px;
    }

    #back-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.85);
      border: none;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.85em;
      font-family: 'Comic Sans MS', cursive;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      z-index: 100;
    }

    /* Winner overlay */
    #winner {
      display: none;
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #667eea, #f093fb);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 2000;
    }

    #winner.visible { display: flex; }

    .winner-stars {
      font-size: 3.2em;
      animation: bounce 0.65s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-18px); }
    }

    .winner-title {
      font-size: 2.8em;
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
      margin: 12px 0 6px;
    }

    .winner-sub {
      font-size: 1.2em;
      color: rgba(255,255,255,0.92);
      margin-bottom: 28px;
    }

    .play-again-btn {
      background: white;
      border: none;
      border-radius: 30px;
      padding: 16px 44px;
      font-size: 1.4em;
      font-family: 'Comic Sans MS', cursive;
      font-weight: bold;
      color: #667eea;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.22);
      transition: transform 0.1s;
    }

    .play-again-btn:active { transform: scale(1.1); }
  </style>
</head>
<body>

    let selectedLetters = [];
    let gameObjects = [];
    let remaining = 0;
    let dragging = null;
    let dragClone = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startGame() {
      document.getElementById('winner').classList.remove('visible');

      const allLetters = Object.keys(LETTER_DATA);
      selectedLetters = shuffle(allLetters).slice(0, 3).sort();

      gameObjects = [];
      selectedLetters.forEach(letter => {
        const items = shuffle(LETTER_DATA[letter]).slice(0, 4);
        items.forEach((item, i) => {
          gameObjects.push({ ...item, letter, id: `${letter}${i}` });
        });
      });
      gameObjects = shuffle(gameObjects);
      remaining = gameObjects.length;

      renderGame();
      updateProgress();
    }

    function renderGame() {
      const area = document.getElementById('objects-area');
      area.innerHTML = '';
      gameObjects.forEach(obj => {
        const el = document.createElement('div');
        el.className = 'object-card';
        el.id = `obj-${obj.id}`;
        el.dataset.letter = obj.letter;
        el.innerHTML = `<span class="obj-emoji">${obj.emoji}</span><span class="obj-name">${obj.name}</span>`;
        area.appendChild(el);
        el.addEventListener('mousedown', onDragStart);
        el.addEventListener('touchstart', onDragStart, { passive: false });
      });

      const boxesArea = document.getElementById('boxes-area');
      boxesArea.innerHTML = '';
      selectedLetters.forEach(letter => {
        const box = document.createElement('div');
        box.className = 'letter-box';
        box.id = `box-${letter}`;
        box.dataset.letter = letter;
        box.innerHTML = `<div class="box-letter">${letter}</div><div class="box-items" id="box-items-${letter}"></div>`;
        boxesArea.appendChild(box);
      });
    }

    function updateProgress() {
      const total = gameObjects.length;
      const placed = total - remaining;
      document.getElementById('progress').textContent = `${placed} / ${total} sorted`;
    }

    function onDragStart(e) {
      e.preventDefault();
      if (dragging) return;
      const touch = e.touches ? e.touches[0] : e;
      dragging = e.currentTarget;

      const rect = dragging.getBoundingClientRect();
      dragOffsetX = touch.clientX - rect.left;
      dragOffsetY = touch.clientY - rect.top;

      dragClone = document.createElement('div');
      dragClone.className = 'drag-clone';
      dragClone.style.width = rect.width + 'px';
      dragClone.style.height = rect.height + 'px';
      dragClone.style.left = rect.left + 'px';
      dragClone.style.top = rect.top + 'px';
      dragClone.innerHTML = dragging.innerHTML;
      document.body.appendChild(dragClone);

      dragging.classList.add('dragging-source');

      document.addEventListener('mousemove', onDragMove);
      document.addEventListener('touchmove', onDragMove, { passive: false });
      document.addEventListener('mouseup', onDragEnd);
      document.addEventListener('touchend', onDragEnd);
    }

    function onDragMove(e) {
      e.preventDefault();
      if (!dragClone) return;
      const touch = e.touches ? e.touches[0] : e;
      dragClone.style.left = (touch.clientX - dragOffsetX) + 'px';
      dragClone.style.top = (touch.clientY - dragOffsetY) + 'px';

      const x = touch.clientX;
      const y = touch.clientY;
      selectedLetters.forEach(letter => {
        const box = document.getElementById(`box-${letter}`);
        const rect = box.getBoundingClientRect();
        const over = x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
        box.classList.toggle('highlight', over);
      });
    }

    function onDragEnd(e) {
      document.removeEventListener('mousemove', onDragMove);
      document.removeEventListener('touchmove', onDragMove);
      document.removeEventListener('mouseup', onDragEnd);
      document.removeEventListener('touchend', onDragEnd);

      selectedLetters.forEach(letter => {
        document.getElementById(`box-${letter}`).classList.remove('highlight');
      });

      if (!dragging || !dragClone) { dragging = null; dragClone = null; return; }

      const touch = e.changedTouches ? e.changedTouches[0] : e;
      const x = touch.clientX;
      const y = touch.clientY;

      let droppedOnLetter = null;
      selectedLetters.forEach(letter => {
        const box = document.getElementById(`box-${letter}`);
        const rect = box.getBoundingClientRect();
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
          droppedOnLetter = letter;
        }
      });

      const correctLetter = dragging.dataset.letter;
      const el = dragging;
      dragging = null;
      dragClone.remove();
      dragClone = null;

      if (droppedOnLetter === correctLetter) {
        playCorrect();
        const emoji = el.querySelector('.obj-emoji').textContent;
        el.remove();

        const mini = document.createElement('span');
        mini.className = 'box-mini-item';
        mini.textContent = emoji;
        document.getElementById(`box-items-${correctLetter}`).appendChild(mini);

        remaining--;
        updateProgress();
        if (remaining === 0) {
          setTimeout(() => {
            playVictory();
            document.getElementById('winner').classList.add('visible');
          }, 400);
        }
      } else if (droppedOnLetter) {
        playWrong();
        el.classList.remove('dragging-source');
        el.classList.add('shake');
        const wrongBox = document.getElementById(`box-${droppedOnLetter}`);
        wrongBox.classList.add('wrong-flash');
        setTimeout(() => wrongBox.classList.remove('wrong-flash'), 420);
        setTimeout(() => el.classList.remove('shake'), 450);
      } else {
        el.classList.remove('dragging-source');
      }
    }

    // --- Audio ---
    function playCorrect() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [[523, 0], [659, 0.13], [784, 0.26]].forEach(([freq, delay]) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = 'sine'; osc.frequency.value = freq;
          const t = ctx.currentTime + delay;
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
          osc.start(t); osc.stop(t + 0.22);
        });
      } catch(e) {}
    }

    function playWrong() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.start(); osc.stop(ctx.currentTime + 0.35);
      } catch(e) {}
    }

    function playVictory() {
      try {
        new Audio('hooray.m4a').play();
      } catch(e) {}
    }

    startGame();
  </script>
